# Source repo workflow: compiles LaTeX and produces a redacted public variant.
#
# SECURITY MODEL: this workflow holds no credentials that can write anywhere
# other than this repo itself. It uses only the default GITHUB_TOKEN, which
# GitHub automatically scopes to this repo alone. A compromise of this repo
# cannot be used to write to your portfolio, cloud storage, or anywhere else.
# See docs/ARCHITECTURE.md for the full trust model.
#
# SETUP:
#   1. Set MAIN_TEX_FILE and REDACT_PATTERN below.
#   2. Push a .tex change, or run this workflow manually from the Actions tab.
#   No repo-wide settings changes are needed: the `permissions` block below
#   grants write access to this workflow only.

name: Compile Resume

permissions:
  contents: write   # lets this workflow commit the compiled PDFs back to this repo

on:
  push:
    branches: [main, master]
    paths: ["*.tex"]
  workflow_dispatch:

env:
  MAIN_TEX_FILE: main.tex      # <-- CHANGE: your LaTeX file's name
  REDACT_PATTERN: '\\faPhone'  # <-- CHANGE: a pattern matching the line(s) to strip from the
                               #     public copy. The default matches any line containing the
                               #     literal text \faPhone. See README "Customizing redaction".

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout this repo
        uses: actions/checkout@v4

      - name: Install TeXLive
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-fonts-extra latexmk

      - name: Compile full resume (private, includes everything)
        run: latexmk -pdf -interaction=nonstopmode "$MAIN_TEX_FILE"

      - name: Create redacted copy
        run: |
          BASENAME="${MAIN_TEX_FILE%.tex}"
          sed "/${REDACT_PATTERN}/d" "$MAIN_TEX_FILE" > "${BASENAME}-public.tex"
          echo "Lines removed by redaction:"
          diff "$MAIN_TEX_FILE" "${BASENAME}-public.tex" || true

      - name: Compile redacted resume (safe for public distribution)
        run: |
          BASENAME="${MAIN_TEX_FILE%.tex}"
          latexmk -pdf -interaction=nonstopmode "${BASENAME}-public.tex"

      - name: Commit both PDFs back to this repo only
        run: |
          BASENAME="${MAIN_TEX_FILE%.tex}"
          git config user.name "resume-sync-bot"
          git config user.email "actions@github.com"   # <-- OPTIONAL: use your own noreply email
                                                       #     (github.com/settings/emails) to have
                                                       #     commits attributed to your account
          git add "${BASENAME}.pdf" "${BASENAME}-public.pdf"
          git diff --cached --quiet && echo "No changes" || git commit -m "Auto-compile resume PDFs"
          git push